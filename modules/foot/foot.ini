[csd]
preferred=server

[cursor]
blink=no
color=1C1E26
style=block

[main]
dpi-aware=yes
font=Input Mono:style=Medium:size=11
font-bold=Input Mono:style=Bold:size=11
font-bold-italic=Input Mono:style=Bold Italic:size=11
font-italic=Input Mono:style=Medium Italic:size=11
locked-title=no
pad=25x25
term=xterm-256color

[mouse]
hide-when-typing=no

[scrollback]
lines=10000

[url]
launch=xdg-open ${url}
